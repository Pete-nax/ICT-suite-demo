spring:
  application:
    name: KenIT ICT Suite

  datasource:
    url: jdbc:h2:mem:kenitdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    time-zone: Africa/Nairobi
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    ke.co.kenit: DEBUG
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: prod

  # Lazy init means beans are created on first request, not all at startup.
  # This cuts peak startup RAM by ~30–40MB — critical on a 512MB free tier.
  main:
    lazy-initialization: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      # Free tier DB also has connection limits — 2 is plenty for low traffic.
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Removing the explicit dialect — Hibernate 6 auto-detects PostgreSQL.
    # The explicit dialect was also generating a WARN in your logs.
    properties:
      hibernate:
        dialect:

  h2:
    console:
      enabled: false
